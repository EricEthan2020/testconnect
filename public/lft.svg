<svg viewBox="0 0 640 700" xmlns="http://www.w3.org/2000/svg" preserveAspectRatio="xMidYMid meet">
  <defs>
    <linearGradient id="gradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="white"/>
      <stop offset="100%" stop-color="#4CC3FF"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="10" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <g fill="url(#gradient)" filter="url(#glow)">
    <rect x="0" y="0" width="80" height="700" rx="40" />
    <rect x="80" y="40" width="80" height="660" rx="40" />
    <rect x="160" y="80" width="80" height="620" rx="40" />
    <rect x="240" y="120" width="80" height="580" rx="40" />
    <rect x="320" y="160" width="80" height="540" rx="40" />
    <rect x="400" y="200" width="80" height="500" rx="40" />
  </g>
</svg>
